<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8edf3" stroke-opacity=".05"/></pattern>
<radialGradient id="glow" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#5b9dff" stop-opacity=".2"/><stop offset="1" stop-color="#5b9dff" stop-opacity="0"/></radialGradient>
<linearGradient id="cell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3b6b"/><stop offset="1" stop-color="#14264a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".12"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<pattern id="thread" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#8a95a4" stroke-width="3"/></pattern>
<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b9dff"/></marker>
</defs>
<rect width="1600" height="900" fill="#0b0f14"/><rect width="1600" height="900" fill="url(#g)"/><rect width="1600" height="900" fill="url(#glow)"/>

<!-- Solar panel frame -->
<rect x="360" y="190" width="880" height="580" rx="14" fill="#17202b" stroke="#2b3a55" stroke-width="4"/>
<g>
  <!-- 6 x 4 cells -->
  <g fill="url(#cell)" stroke="#5b9dff" stroke-opacity=".35" stroke-width="2">
    <rect x="410" y="215" width="120" height="125" rx="4"/><rect x="545" y="215" width="120" height="125" rx="4"/><rect x="680" y="215" width="120" height="125" rx="4"/><rect x="815" y="215" width="120" height="125" rx="4"/><rect x="950" y="215" width="120" height="125" rx="4"/><rect x="1085" y="215" width="120" height="125" rx="4"/>
    <rect x="410" y="355" width="120" height="125" rx="4"/><rect x="545" y="355" width="120" height="125" rx="4"/><rect x="680" y="355" width="120" height="125" rx="4"/><rect x="815" y="355" width="120" height="125" rx="4"/><rect x="950" y="355" width="120" height="125" rx="4"/><rect x="1085" y="355" width="120" height="125" rx="4"/>
    <rect x="410" y="495" width="120" height="125" rx="4"/><rect x="545" y="495" width="120" height="125" rx="4"/><rect x="680" y="495" width="120" height="125" rx="4"/><rect x="815" y="495" width="120" height="125" rx="4"/><rect x="950" y="495" width="120" height="125" rx="4"/><rect x="1085" y="495" width="120" height="125" rx="4"/>
    <rect x="410" y="635" width="120" height="110" rx="4"/><rect x="545" y="635" width="120" height="110" rx="4"/><rect x="680" y="635" width="120" height="110" rx="4"/><rect x="815" y="635" width="120" height="110" rx="4"/><rect x="950" y="635" width="120" height="110" rx="4"/><rect x="1085" y="635" width="120" height="110" rx="4"/>
  </g>
  <rect x="410" y="215" width="795" height="530" fill="url(#shine)"/>
  <!-- dust patches on the unwashed (upper) area -->
  <g fill="#b8a58a" opacity=".22"><ellipse cx="600" cy="280" rx="90" ry="30"/><ellipse cx="900" cy="400" rx="120" ry="34"/><ellipse cx="1130" cy="270" rx="60" ry="24"/></g>
</g>

<!-- Lead screws -->
<rect x="318" y="180" width="26" height="600" rx="6" fill="url(#thread)" stroke="#8a95a4"/>
<rect x="1256" y="180" width="26" height="600" rx="6" fill="url(#thread)" stroke="#8a95a4"/>

<!-- Wiper bar (mid-stroke) -->
<g>
  <rect x="300" y="505" width="1000" height="34" rx="8" fill="#e2c46b" stroke="#0b0f14" stroke-width="3"/>
  <rect x="330" y="539" width="940" height="10" rx="3" fill="#8a95a4"/>
  <rect x="300" y="495" width="62" height="54" rx="8" fill="#f0b44c" stroke="#0b0f14" stroke-width="3"/>
  <rect x="1238" y="495" width="62" height="54" rx="8" fill="#f0b44c" stroke="#0b0f14" stroke-width="3"/>
  <!-- spray droplets below the bar -->
  <g fill="#5b9dff" opacity=".85"><circle cx="460" cy="570" r="6"/><circle cx="540" cy="585" r="5"/><circle cx="640" cy="568" r="6"/><circle cx="740" cy="590" r="5"/><circle cx="840" cy="572" r="6"/><circle cx="940" cy="588" r="5"/><circle cx="1040" cy="570" r="6"/><circle cx="1140" cy="584" r="5"/></g>
</g>

<!-- Motors (top) -->
<g>
  <rect x="296" y="110" width="70" height="72" rx="10" fill="#17202b" stroke="#5b9dff" stroke-width="3"/><text x="331" y="154" font-family="Consolas, monospace" font-size="22" fill="#e8edf3" text-anchor="middle" font-weight="700">M1</text>
  <rect x="1234" y="110" width="70" height="72" rx="10" fill="#17202b" stroke="#5b9dff" stroke-width="3"/><text x="1269" y="154" font-family="Consolas, monospace" font-size="22" fill="#e8edf3" text-anchor="middle" font-weight="700">M2</text>
</g>

<!-- Limit switches -->
<g font-family="Consolas, monospace" font-size="16" fill="#a6b0bd">
  <rect x="390" y="196" width="46" height="14" rx="4" fill="#ef6b6b"/><text x="446" y="209">LS-TOP</text>
  <rect x="390" y="752" width="46" height="14" rx="4" fill="#ef6b6b"/><text x="446" y="765">LS-BOT</text>
</g>

<!-- Direction arrows -->
<path d="M200 260V680" stroke="#5b9dff" stroke-width="5" fill="none" marker-end="url(#arw)" stroke-dasharray="12 10"/>
<text x="200" y="230" font-family="Consolas, monospace" font-size="17" fill="#8a95a4" text-anchor="middle" letter-spacing="2">CLEAN STROKE</text>
<path d="M1400 680V260" stroke="#2fbf8a" stroke-width="5" fill="none" marker-end="url(#arw)" stroke-dasharray="12 10"/>
<text x="1400" y="715" font-family="Consolas, monospace" font-size="17" fill="#8a95a4" text-anchor="middle" letter-spacing="2">RETURN STROKE</text>

<!-- Controller + pump -->
<g font-family="Consolas, monospace" font-size="18" text-anchor="middle">
  <rect x="640" y="808" width="150" height="56" rx="10" fill="#17202b" stroke="#2fbf8a" stroke-width="3"/><text x="715" y="843" fill="#e8edf3">MCU</text>
  <rect x="820" y="808" width="150" height="56" rx="10" fill="#17202b" stroke="#5b9dff" stroke-width="3"/><text x="895" y="843" fill="#e8edf3">DRIVER</text>
  <rect x="1000" y="808" width="150" height="56" rx="10" fill="#17202b" stroke="#5b9dff" stroke-width="3"/><text x="1075" y="843" fill="#e8edf3">PUMP</text>
  <path d="M790 836H820M970 836H1000" stroke="#5b9dff" stroke-width="3" marker-end="url(#arw)"/>
</g>

<text x="800" y="70" font-family="Consolas, monospace" font-size="24" fill="#e8edf3" text-anchor="middle" letter-spacing="3">DUAL-MOTOR LEAD-SCREW SOLAR PANEL CLEANER</text>
</svg>
