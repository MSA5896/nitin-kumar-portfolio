<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8edf3" stroke-opacity=".05"/></pattern>
<radialGradient id="glow" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#5b9dff" stop-opacity=".2"/><stop offset="1" stop-color="#5b9dff" stop-opacity="0"/></radialGradient>
<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b9dff"/></marker>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="900" fill="#0b0f14"/><rect width="1600" height="900" fill="url(#g)"/><rect width="1600" height="900" fill="url(#glow)"/>
<!-- Stage 1: data files -->
<g>
  <rect x="150" y="300" width="270" height="320" rx="18" fill="#17202b" stroke="#2f3b4a" stroke-width="2" transform="rotate(-6 285 460)"/>
  <rect x="170" y="280" width="270" height="320" rx="18" fill="#111720" stroke="#2f3b4a" stroke-width="2"/>
  <rect x="170" y="280" width="270" height="56" rx="18" fill="#18794e" fill-opacity=".35"/><rect x="170" y="316" width="270" height="20" fill="#18794e" fill-opacity=".35"/>
  <text x="196" y="316" font-family="Consolas, monospace" font-size="18" fill="#4cc38a" font-weight="700">.xlsx / .csv</text>
  <g stroke="#2f3b4a" stroke-width="2"><path d="M190 380H420M190 424H420M190 468H420M190 512H420M190 556H420M262 345V585M340 345V585"/></g>
  <g fill="#a6b0bd" opacity=".45"><rect x="200" y="396" width="48" height="12" rx="6"/><rect x="274" y="396" width="52" height="12" rx="6"/><rect x="352" y="396" width="44" height="12" rx="6"/><rect x="200" y="440" width="40" height="12" rx="6"/><rect x="274" y="440" width="58" height="12" rx="6"/><rect x="352" y="440" width="50" height="12" rx="6"/><rect x="200" y="484" width="52" height="12" rx="6"/><rect x="274" y="484" width="44" height="12" rx="6"/><rect x="352" y="484" width="40" height="12" rx="6"/><rect x="200" y="528" width="44" height="12" rx="6"/><rect x="274" y="528" width="54" height="12" rx="6"/><rect x="352" y="528" width="48" height="12" rx="6"/></g>
  <text x="305" y="680" font-family="Consolas, monospace" font-size="18" fill="#8a95a4" text-anchor="middle" letter-spacing="3">RAW DATA</text>
</g>
<path d="M470 450H585" stroke="#5b9dff" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#arw)"/>
<!-- Stage 2: Python + AI processing -->
<g>
  <rect x="610" y="230" width="380" height="440" rx="22" fill="#111720" stroke="#5b9dff" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="646" cy="266" r="7" fill="#ef6b6b"/><circle cx="670" cy="266" r="7" fill="#f0b44c"/><circle cx="694" cy="266" r="7" fill="#4cc38a"/>
  <g font-family="Consolas, monospace" font-size="19">
    <text x="640" y="330" fill="#a78bfa">import</text><text x="716" y="330" fill="#e8edf3">pandas as pd</text>
    <text x="640" y="370" fill="#e8edf3">df = pd.</text><text x="728" y="370" fill="#5b9dff">read_excel</text><text x="840" y="370" fill="#e8edf3">(…)</text>
    <text x="640" y="410" fill="#e8edf3">summary = </text><text x="752" y="410" fill="#5b9dff">analyse</text><text x="832" y="410" fill="#e8edf3">(df)</text>
    <text x="640" y="450" fill="#e8edf3">charts  = </text><text x="752" y="450" fill="#5b9dff">plot</text><text x="800" y="450" fill="#e8edf3">(summary)</text>
    <text x="640" y="490" fill="#8a95a4"># AI drafts, human reviews</text>
    <text x="640" y="530" fill="#e8edf3">notes = </text><text x="730" y="530" fill="#f0b44c">ai_summary</text><text x="842" y="530" fill="#e8edf3">(…)</text>
    <text x="640" y="570" fill="#5b9dff">export</text><text x="708" y="570" fill="#e8edf3">(</text><text x="720" y="570" fill="#4cc38a">"report.pdf"</text><text x="852" y="570" fill="#e8edf3">)</text>
  </g>
  <g transform="translate(930 620)" fill="none" stroke="#5b9dff" stroke-width="5" opacity=".55"><circle r="22"/><path d="M0-36V-26M0 26V36M-36 0H-26M26 0H36M-25-25L-18-18M18 18L25 25M-25 25L-18 18M18-18L25-25"/></g>
  <text x="800" y="730" font-family="Consolas, monospace" font-size="18" fill="#8a95a4" text-anchor="middle" letter-spacing="3">PYTHON + AI</text>
</g>
<path d="M1015 450H1130" stroke="#5b9dff" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#arw)"/>
<!-- Stage 3: report -->
<g>
  <rect x="1190" y="250" width="290" height="390" rx="16" fill="#17202b" stroke="#2f3b4a" stroke-width="2" transform="rotate(5 1335 445)"/>
  <rect x="1160" y="230" width="290" height="400" rx="16" fill="#e8edf3"/>
  <rect x="1188" y="262" width="150" height="16" rx="8" fill="#0e1621"/>
  <rect x="1188" y="290" width="100" height="10" rx="5" fill="#5a6677"/>
  <rect x="1366" y="256" width="58" height="28" rx="6" fill="#ef6b6b"/><text x="1395" y="276" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
  <rect x="1188" y="320" width="234" height="140" rx="10" fill="#dfe6ef"/>
  <g fill="#1b5ccc"><rect x="1206" y="400" width="26" height="44" rx="3"/><rect x="1244" y="372" width="26" height="72" rx="3"/><rect x="1282" y="388" width="26" height="56" rx="3"/><rect x="1320" y="352" width="26" height="92" rx="3"/><rect x="1358" y="378" width="26" height="66" rx="3" fill="#c47800"/></g>
  <g fill="#5a6677" opacity=".7"><rect x="1188" y="480" width="234" height="10" rx="5"/><rect x="1188" y="500" width="210" height="10" rx="5"/><rect x="1188" y="520" width="224" height="10" rx="5"/><rect x="1188" y="550" width="120" height="10" rx="5" fill="#1b5ccc"/><rect x="1188" y="570" width="200" height="10" rx="5"/><rect x="1188" y="590" width="170" height="10" rx="5"/></g>
  <text x="1305" y="700" font-family="Consolas, monospace" font-size="18" fill="#8a95a4" text-anchor="middle" letter-spacing="3">READY REPORT</text>
</g>
</svg>
