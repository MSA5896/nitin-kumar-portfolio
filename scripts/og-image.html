<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0b0f14;font-family:"Segoe UI",Inter,Arial,sans-serif;color:#e8edf3;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(232,237,243,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(232,237,243,.05) 1px,transparent 1px);background-size:44px 44px}
  .glow{position:absolute;top:-220px;left:200px;width:800px;height:500px;border-radius:50%;background:#5b9dff;opacity:.10;filter:blur(80px)}
  .wrap{position:absolute;left:80px;top:96px;right:80px}
  .badge{display:inline-block;border:2px solid #2f3b4a;border-radius:12px;padding:10px 16px;font:700 26px Consolas,monospace;color:#e8edf3}
  h1{font-size:92px;font-weight:800;letter-spacing:-2px;margin:38px 0 10px}
  .role{font-size:38px;font-weight:600;margin:0}
  .tags{font:500 28px Consolas,monospace;color:#5b9dff;margin-top:18px;letter-spacing:1px}
  .foot{position:absolute;left:80px;bottom:60px;font-size:24px;color:#a6b0bd}
  svg{position:absolute;left:0;bottom:0;width:1200px;height:160px;opacity:.3}
</style></head>
<body><div class="grid"></div><div class="glow"></div>
<svg viewBox="0 0 1200 160" preserveAspectRatio="none"><path d="M0 110 H180 L210 110 L230 60 L250 140 L270 90 L290 110 H520 L540 110 L560 40 L585 130 L605 110 H860 L880 110 L895 75 L915 120 L930 110 H1200" fill="none" stroke="#5b9dff" stroke-width="2"/></svg>
<div class="wrap">
  <span class="badge">NK</span>
  <h1>Nitin Kumar</h1>
  <p class="role">QA &amp; Manufacturing Engineer</p>
  <p class="tags">AI Automation | IoT | Robotics</p>
</div>
<div class="foot">Medical-device quality · M.Tech, IIT Bhilai · Python · Data · IoT</div>
</body></html>
